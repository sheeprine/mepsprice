{% extends "base.html" %}
{% block title %}MepsPrice — Admin Login{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="mb-8 text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Admin Login</h1>
    <p class="text-gray-500 text-sm">Enter your password to manage tracked products.</p>
  </div>

  {% if error %}
  <div class="mb-6 flex items-start gap-3 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
    <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/admin/login" class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      required
      autofocus
      class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
    />
    <button type="submit"
      class="mt-4 w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
      Login
    </button>
  </form>
</div>
{% endblock %}
